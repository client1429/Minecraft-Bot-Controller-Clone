<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Bot 3D Viewer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
            z-index: 100;
            font-size: 12px;
            pointer-events: none;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
            z-index: 100;
            pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: white;
        }
        #crosshair::before {
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            transform: translateY(-50%);
        }
        #crosshair::after {
            top: 0;
            left: 50%;
            width: 2px;
            height: 100%;
            transform: translateX(-50%);
        }
        .ui-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            padding: 10px;
            border-radius: 5px;
            color: white;
            z-index: 100;
            pointer-events: none;
            font-size: 14px;
        }
        .stat-bar {
            height: 20px;
            margin: 5px 0;
            border-radius: 3px;
            transition: width 0.3s;
        }
        .health-bar { background: #E74C3C; }
        .food-bar { background: #F39C12; }
        .stat-label {
            display: inline-block;
            width: 60px;
        }
        .stat-value {
            display: inline-block;
            margin-left: 10px;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            padding: 10px;
            border-radius: 5px;
            z-index: 100;
            pointer-events: auto;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 5px 10px;
            margin: 5px;
            border-radius: 3px;
            cursor: pointer;
        }
        button:hover {
            background: #764ba2;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="info">
        <div>🎮 Bot: <span id="botName">Loading...</span></div>
        <div>📍 Position: <span id="position">0, 0, 0</span></div>
        <div>🎯 Looking at: <span id="lookingAt">Block</span></div>
    </div>
    <div id="crosshair"></div>
    <div class="ui-panel">
        <div>
            <span class="stat-label">❤️ Health</span>
            <span class="stat-value" id="health">20</span>
            <div class="stat-bar health-bar" id="healthBar" style="width: 100%"></div>
        </div>
        <div>
            <span class="stat-label">🍗 Food</span>
            <span class="stat-value" id="food">20</span>
            <div class="stat-bar food-bar" id="foodBar" style="width: 100%"></div>
        </div>
        <div class="stats">
            <div>🖐️ Holding: <span id="heldItem">Nothing</span></div>
            <div>👥 Nearby: <span id="entityCount">0</span></div>
            <div>🔷 Blocks: <span id="blockCount">0</span></div>
        </div>
    </div>
    <div id="controls">
        <button onclick="toggleFullscreen()">🖥️ Fullscreen</button>
        <button onclick="resetCamera()">🎥 Reset View</button>
        <button onclick="takeScreenshot()">📸 Screenshot</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4/dist/socket.io.min.js"></script>
    <script>
        const socket = io();
        let scene, camera, renderer;
        let blocks = [];
        let entities = [];
        let currentBotId = null;
        
        // Three.js Setup
        function initThree() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 100, 200);
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 5);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(10, 20, 5);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 1024;
            directionalLight.shadow.mapSize.height = 1024;
            scene.add(directionalLight);
            
            const backLight = new THREE.PointLight(0x4466cc, 0.5);
            backLight.position.set(0, 10, -10);
            scene.add(backLight);
            
            // Sky gradient
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#4A90E2');
            gradient.addColorStop(1, '#87CEEB');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            const skyTexture = new THREE.CanvasTexture(canvas);
            scene.background = skyTexture;
            
            animate();
        }
        
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        
        function createBlock(x, y, z, color) {
            const geometry = new THREE.BoxGeometry(0.95, 0.95, 0.95);
            const material = new THREE.MeshStandardMaterial({ color: color });
            const cube = new THREE.Mesh(geometry, material);
            cube.position.set(x, y, z);
            cube.castShadow = true;
            cube.receiveShadow = true;
            scene.add(cube);
            return cube;
        }
        
        function createEntity(x, y, z, color, username) {
            const geometry = new THREE.BoxGeometry(0.6, 1.2, 0.6);
            const material = new THREE.MeshStandardMaterial({ color: color });
            const entity = new THREE.Mesh(geometry, material);
            entity.position.set(x, y, z);
            entity.castShadow = true;
            scene.add(entity);
            
            if (username) {
                // Add name tag
                const canvas = document.createElement('canvas');
                canvas.width = 256;
                canvas.height = 64;
                const context = canvas.getContext('2d');
                context.fillStyle = 'rgba(0,0,0,0.7)';
                context.fillRect(0, 0, canvas.width, canvas.height);
                context.fillStyle = 'white';
                context.font = 'Bold 20px Arial';
                context.textAlign = 'center';
                context.fillText(username, canvas.width/2, canvas.height/2);
                
                const texture = new THREE.CanvasTexture(canvas);
                const nameMaterial = new THREE.SpriteMaterial({ map: texture });
                const sprite = new THREE.Sprite(nameMaterial);
                sprite.scale.set(1, 0.25, 1);
                sprite.position.set(0, 0.8, 0);
                entity.add(sprite);
            }
            
            return entity;
        }
        
        function updateWorld(blocksData, entitiesData, botPos, botYaw, botPitch) {
            // Clear old blocks
            blocks.forEach(block => scene.remove(block));
            blocks = [];
            
            // Clear old entities
            entities.forEach(entity => scene.remove(entity));
            entities = [];
            
            // Add blocks
            blocksData.forEach(blockData => {
                const block = createBlock(blockData.x, blockData.y, blockData.z, blockData.color);
                blocks.push(block);
            });
            
            // Add entities
            entitiesData.forEach(entityData => {
                const entity = createEntity(entityData.x, entityData.y, entityData.z, entityData.color, entityData.username);
                entities.push(entity);
            });
            
            // Update camera
            camera.position.set(botPos.x, botPos.y + 1.6, botPos.z);
            camera.rotation.order = 'YXZ';
            camera.rotation.y = botYaw;
            camera.rotation.x = botPitch;
            
            document.getElementById('position').textContent = `${Math.floor(botPos.x)}, ${Math.floor(botPos.y)}, ${Math.floor(botPos.z)}`;
            document.getElementById('entityCount').textContent = entitiesData.length;
            document.getElementById('blockCount').textContent = blocksData.length;
        }
        
        function updateUI(health, food, heldItem) {
            document.getElementById('health').textContent = health;
            document.getElementById('food').textContent = food;
            document.getElementById('healthBar').style.width = (health / 20) * 100 + '%';
            document.getElementById('foodBar').style.width = (food / 20) * 100 + '%';
            document.getElementById('heldItem').textContent = heldItem || 'Nothing';
        }
        
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }
        
        function resetCamera() {
            camera.position.set(0, 2, 5);
            camera.lookAt(0, 0, 0);
        }
        
        function takeScreenshot() {
            const canvas = renderer.domElement;
            const link = document.createElement('a');
            link.download = 'minecraft-screenshot.png';
            link.href = canvas.toDataURL();
            link.click();
        }
        
        // Socket events
        socket.on('connect', () => {
            console.log('Connected to server');
            socket.emit('request-bots-list');
        });
        
        socket.on('bots-list-update', (bots) => {
            if (bots.length > 0 && !currentBotId) {
                currentBotId = bots[0].id;
                document.getElementById('botName').textContent = bots[0].username;
                
                // Request world data every second
                setInterval(() => {
                    if (currentBotId) {
                        fetch(`/api/bot/${currentBotId}/world-data`)
                            .then(res => res.json())
                            .then(data => {
                                if (data.success) {
                                    updateWorld(data.blocks, data.entities, data.botPos, data.botYaw, data.botPitch);
                                    updateUI(data.stats.health, data.stats.food, data.stats.heldItem);
                                }
                            })
                            .catch(err => console.error('Error fetching world data:', err));
                    }
                }, 1000);
            }
        });
        
        socket.on('bot-status-update', (data) => {
            if (data.botId === currentBotId) {
                document.getElementById('botName').textContent = data.username;
                if (data.position) {
                    document.getElementById('position').textContent = `${data.position.x}, ${data.position.y}, ${data.position.z}`;
                }
            }
        });
        
        // Initialize
        initThree();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
